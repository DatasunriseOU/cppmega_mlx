[build-system]
requires = ["setuptools>=68", "mlx==0.32.0", "nanobind>=2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "cppmega-mlx"
version = "0.1.0"
description = "MLX-native local training port of cppmega model semantics"
requires-python = ">=3.11"
dependencies = [
    "mlx==0.32.0",
    "mlx-lm @ git+https://github.com/DatasunriseOU/mlx-lm.git@8618587943181787d33bac4468d3088e80202b3f",
    "numpy>=1.26",
    "safetensors>=0.7",
    "tokenizers>=0.22",
    "z3-solver>=4.15,<4.15.5",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=21",
]
gui = [
    "pydantic>=2.10",
    "fastapi>=0.110",
    "starlette>=1.3.1",
    "idna>=3.15",
    "uvicorn>=0.30",
    "websockets>=12",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "python-multipart>=0.0.20",
]
widget = [
    "anywidget>=0.9",
    "traitlets>=5.0",
    "ipywidgets>=8.0",
]
path-c = [
    "apache-tvm-ffi>=0.1.2,<0.1.8; (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Linux' and platform_machine == 'x86_64')",
    "cloudpickle>=3.1",
    "cython>=3.0,<4",
    "einops>=0.8",
    "ml-dtypes>=0.5",
    "tilelang==0.1.9; (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Linux' and platform_machine == 'x86_64')",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "datasketch==1.10.0",
    "libclang==18.1.1",
    "nanobind>=2.4",
    "pandas>=2.2",
    "pyarrow>=21",
    "pytest>=9.0.3",
]

[project.scripts]
cppmega-run = "cppmega_v4.runner.cli:main"

[tool.setuptools.package-data]
"cppmega_v4.widget" = ["static/*.mjs", "static/*.css"]
"cppmega_v4.nn._external" = ["*.json"]
"cppmega_mlx.data" = ["*.json"]
"cppmega_mlx.tokenizer" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "parity: equivalence checks against reference cppmega or documented parity anchors",
    "kernel: MLX kernel, compilation, profiling, and adoption-gate coverage",
    "training: training-loop, optimizer, checkpoint, and dataset-ingress coverage",
    "mlx_runtime: tests that execute MLX array or model operations",
    "bench: benchmark scripts, benchmark receipts, and comparison-policy coverage",
    "distributed: distributed-training boundary checks and fail-closed parity guards",
    "slow: tests that spawn subprocesses or run extended training loops; opt-in via -m slow",
    "cuda_required: tests that need CUDA hardware and toolchain",
    "cuda_hardware: tests that must execute on a real CUDA device",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
