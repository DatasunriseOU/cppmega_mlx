[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cppmega-mlx"
version = "0.1.0"
description = "MLX-native local training port of cppmega model semantics"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.31",
    "mlx-lm>=0.31",
    "numpy>=1.26",
    "safetensors>=0.7",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=21",
]
gui = [
    "pydantic>=2.10",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["cppmega_mlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "parity: equivalence checks against reference cppmega or documented parity anchors",
    "kernel: MLX kernel, compilation, profiling, and adoption-gate coverage",
    "training: training-loop, optimizer, checkpoint, and dataset-ingress coverage",
    "bench: benchmark scripts, benchmark receipts, and comparison-policy coverage",
    "distributed: distributed-training boundary checks and fail-closed parity guards",
    "slow: tests that spawn subprocesses or run extended training loops; opt-in via -m slow",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
