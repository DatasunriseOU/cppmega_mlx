name: CUDA Lane

on:
  # CUDA capacity is provisioned explicitly (for example on Nebius H200).
  # Do not leave ordinary PRs queued forever when no self-hosted CUDA runner
  # is attached to this repository.
  workflow_dispatch:

jobs:
  cuda-tests:
    name: Run CUDA-only tests
    runs-on: [self-hosted, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CUDA tests
        run: |
          python -m pytest -m "cuda_hardware or cuda_required" -v --tb=short
